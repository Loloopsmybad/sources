{% extends "base.html" %}

{% block content %}
<div class="student-selection-section">
    <h2>Select Student for Performance Analysis</h2>
    
    {% if error %}
    <div class="error-message">
        {{ error }}
    </div>
    {% endif %}
    
    <form method="POST" action="{{ url_for('student_report') }}">
        <div class="student-selection">
            <label for="student">Choose a Student:</label>
            <select name="student" id="student" required>
                <option value="">-- Select Student --</option>
                {% for student in students %}
                <option value="{{ student }}">{{ student }}</option>
                {% endfor %}
            </select>
            <button type="submit">Generate Report</button>
        </div>
    </form>
    
    <div class="instructions">
        <h3>Instructions:</h3>
        <ul>
            <li>Select a student from the dropdown</li>
            <li>View detailed performance report</li>
            <li>See individual subject performance</li>
        </ul>
    </div>
</div>
{% endblock %}
